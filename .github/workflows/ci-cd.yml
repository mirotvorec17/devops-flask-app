name: CI/CD Flask Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Тестирование приложения
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Проверка качества кода
        run: |
          flake8 app.py test_app.py

      - name: Запуск тестов
        run: |
          pytest -q

      - name: Сборка артефакта
        run: |
          mkdir -p dist
          python -m zipfile -c dist/student-info-app.zip \
            app.py test_app.py requirements.txt Dockerfile

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: student-info-app
          path: dist/student-info-app.zip

  deploy:
    name: Деплой в тестовую среду
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: self-hosted

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Сборка Docker-образа
        run: |
          sudo docker build -t student-info-app:latest .

      - name: Остановка старого контейнера
        run: |
          sudo docker stop student-info-app || true

      - name: Удаление старого контейнера
        run: |
          sudo docker rm student-info-app || true

      - name: Запуск нового контейнера
        run: |
          sudo docker run -d \
            --name student-info-app \
            -p 5000:5000 \
            student-info-app:latest

      - name: Проверка приложения
        run: |
          sleep 5
          curl -f http://localhost:5000/health
