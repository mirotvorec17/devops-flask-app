services:
  web:
    build: .
    container_name: student-info-app
    ports:
      - "5000:5000"
    environment:
      APP_ENV: test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
